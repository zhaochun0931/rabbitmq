version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
      - "1883:1883"
    environment:
      RABBITMQ_ERLANG_COOKIE: "rabbitmq"
      RABBITMQ_DEFAULT_USER: "admin"
      RABBITMQ_DEFAULT_PASS: "password"
    volumes:
      - ./data:/var/lib/rabbitmq # 直接挂载本地 ./data 目录
    # 1. 增加健康检查，检查 5672 端口/MQ服务是否彻底就绪
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rabbitmq_net

  client:
    build: .
    container_name: rmq-client-tester
    # 2. 修改依赖关系：只有在 rabbitmq 健康检查通过后才启动 client
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
    cap_add:
      - NET_ADMIN
    networks:
      - rabbitmq_net

networks:
  rabbitmq_net:
    driver: bridge
