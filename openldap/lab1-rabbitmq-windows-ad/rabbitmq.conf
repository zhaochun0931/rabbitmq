# ==============================================================================
# LDAP & Internal Fallback 认证配置
# ==============================================================================

# 1. 认证链：先查 LDAP，查不到或失败自动退回内部数据库 (guest 等账号)
auth_backends.1 = rabbit_auth_backend_ldap
auth_backends.2 = rabbit_auth_backend_internal

# 2. Samba 4 / LDAP 服务器连接设置
auth_ldap.servers.1 = samba-ad
auth_ldap.port      = 389
auth_ldap.use_ssl   = false
auth_ldap.idle_timeout = 120000

# 3. Bind 服务账号 (Samba 4 必须配置)
auth_ldap.dn_lookup_bind.user_dn  = CN=Administrator,CN=Users,DC=corp,DC=local
auth_ldap.dn_lookup_bind.password = Admin123456

# 4. 账号检索逻辑 (兼容 testuser 与 CORP\testuser)
auth_ldap.dn_lookup_attribute = sAMAccountName
auth_ldap.dn_lookup_base      = DC=corp,DC=local

# 5. 降低磁盘报警限制，防止因宿主机磁盘低空间触发拦截
disk_free_limit.absolute = 50MB

# 6. 开启调试日志
log.console.level = debug
auth_ldap.log = true
